///IMPORTS
exec steamhappy.cfg

///ALIAS

//help
alias chelp "echoln commands:;echoln - knives #lists all available knife commands;echoln - crosshairs #lists all available crosshair codes;echoln - sens #sets sensitivity to my default;echoln - cbinds #lists all cfg binds;echoln - ignoremsg #toggle between chat message visibility"

//longjump
alias +lj "+duck; bind mouse_x lj1"
alias -lj "-duck; bind mouse_x lj2"
alias lj1 "+jump; revert"
alias lj2 "-jump; revert"
alias revert "bind mouse_x yaw"

//jumpbug
alias +jb "-duck; bind mouse_x jb1"
alias -jb "-jump"
alias jb1 "+jump; bind mouse_x jb2"
alias jb2 "-jump; revert"
alias revert "bind mouse_x yaw"

//crosshairs
alias crosshairs "echoln mao_cross;echoln doza_cross;"
alias mao_cross "echo TBD"
alias doza_cross "echo CSGO-6DENL-cj7a5-Y3sT5-ZRimk-5N4ED"

//sens
alias sens "sensitivity 0.8659092833771089"

//pep talk
alias talk "defaulttalk"
alias defaulttalk "getout;alias talk peptalk"
alias peptalk "playerchatwheel CW.PepTalk #Chatwheel_pepTalk;alias talk gogogo"
alias gogogo "playerchatwheel CW.GoGoGo #Chatwheel_gogogo;alias talk defaulttalk"

//give knife
alias knives "echoln knife_classic;echoln knife_bf;echoln knife_plugs;echoln knife_m9;echoln knife_bayo;echoln knife_kara;echoln knife_stick;echoln knife_flip;"
alias knife_classic "sv_cheats 1;mp_drop_knife_enable 1;slot3;slot3;drop;subclass_create 503;"
alias knife_bf "sv_cheats 1;mp_drop_knife_enable 1;slot3;slot3;drop;subclass_create 515;"
alias knife_plugs "sv_cheats 1;mp_drop_knife_enable 1;slot3;slot3;drop;subclass_create 516;"
alias knife_m9 "sv_cheats 1;mp_drop_knife_enable 1;slot3;slot3;drop;subclass_create 508;"
alias knife_bayo "sv_cheats 1;mp_drop_knife_enable 1;slot3;slot3;drop;subclass_create 500;"
alias knife_kara "sv_cheats 1;mp_drop_knife_enable 1;slot3;slot3;drop;subclass_create 507;"
alias knife_stick "sv_cheats 1;mp_drop_knife_enable 1;slot3;slot3;drop;subclass_create 522;"
alias knife_flip "sv_cheats 1;mp_drop_knife_enable 1;slot3;slot3;drop;subclass_create 505;"

//inspect knife
alias ik_navsapph "!i csgo_econ_action_preview 0018880420A00328063800409705BAC89800;"
alias ik_navrub "!i csgo_econ_action_preview 00188804209F032806380040617FD22DE1;"
alias ik_bfrust "!i csgo_econ_action_preview 00188304209E03280638D7C7C2F70340221F57A20F;"
alias ik_karust "!i csgo_econ_action_preview 0018FB03209E03280638D7C7C2F70340AA0400620770;"
alias ik_nosapph "!i csgo_econ_action_preview 0018890420A0032806380040F503824C220C;"
alias ik_bfsapph "!i csgo_econ_action_preview 0018830420EB042806380040FB0300466864;"

//colors
alias change_color "ch_white"
alias ch_white "cl_crosshaircolor_r 255;cl_crosshaircolor_b 255;cl_crosshaircolor_g 255;cl_crosshairalpha 255;alias change_color ch_pink"
alias ch_pink "cl_crosshaircolor_r 250;cl_crosshaircolor_b 198;cl_crosshaircolor_g 213;cl_crosshairalpha 250;alias change_color ch_ice"
alias ch_ice "cl_crosshaircolor_r 208;cl_crosshaircolor_b 225;cl_crosshaircolor_g 241;cl_crosshairalpha 255;alias change_color ch_orang"
alias ch_orang "cl_crosshaircolor_r 255;cl_crosshaircolor_b 0;cl_crosshaircolor_g 103;cl_crosshairalpha 255;alias change_color ch_fluo"
alias ch_fluo "cl_crosshaircolor_r 8;cl_crosshaircolor_b 8;cl_crosshaircolor_g 255;cl_crosshairalpha 255;alias change_color ch_sky"
alias ch_sky "cl_crosshaircolor_r 0;cl_crosshaircolor_g 255;cl_crosshaircolor_b 165;cl_crosshairalpha 255;alias change_color ch_pink"

//sound
alias toggle_music "toggle snd_musicvolume"
alias toggle_volume "toggle volume 0 0.08 0.3"

//ez melee
alias knife_zeus "slot3;slot11"

//chat commands
alias say_meow "m1"
alias m1 "say meow;alias say_meow m2"
alias m2 "say мяу;alias say_meow m1"

//list binds
alias cbinds "echoln - Q #ping;echoln - ALT #knife -> zeus;echoln - N #toggle_music;echoln - M #toggle_volume;echoln - L #change crosshair color;echoln - P #disconnect;echoln - Z #voicelines;echoln - COMMA #steamhappy;echoln - DOT #MEOW;echoln - MWHEELUP #jumpbug;echoln - MWHEELDOWN #jump;echoln - ENTER #dont mess with texas;"

///AUTOCONF

//misc
r_show_build_info 0
developer 1
tv_enable 1

//defaults
bind enter "messagemode2"
bind enter "say DON'T MESS WITH TEXAS!"
bind q "player_ping"
bind alt "knife_zeus"
bind n "toggle_music"
bind m "toggle_volume"
bind l "change_color"
bind p "disconnect"
bind z "talk"
bind , "say_steamhappy"
bind . "say_meow"
bind space "+jump"
bind mwheelup "+jb"
bind mwheeldown "+jump"
bind F11 "toggleconsole"

//doza sound
stopsound
stopsoundscape
snd_front_headphone_position 53.2
snd_rear_headphone_position 90.0
snd_headphone_pan_exponent 1.2
snd_headphone_pan_radial_weight 0.5
snd_headphone_eq 1
snd_mute_losefocus 1

//doza model
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 2
viewmodel_offset_z -2
viewmodel_presetpos 0

///EOF
clear
showconsole